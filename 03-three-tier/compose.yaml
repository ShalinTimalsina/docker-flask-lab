# Three-tier Docker Compose application (Database, Backend, Frontend)
services:
  # Database service running PostgreSQL 17
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass123
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Backend service running Python 3.12 Flask and Gunicorn
  backend:
    build: ./backend
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass123
    ports:
      - "5000:5000"
    depends_on:
      - database

  # Frontend service running React served by Nginx
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

# Named volume to persist PostgreSQL database files
volumes:
  postgres-data:
