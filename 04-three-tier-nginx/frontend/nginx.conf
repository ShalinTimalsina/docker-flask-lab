# Nginx configuration for 04-three-tier-nginx frontend container
# Serves static React files only; API routing is handled by the outer Nginx proxy
server {
    listen 80;
    server_name localhost;

    # Serve compiled React static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
