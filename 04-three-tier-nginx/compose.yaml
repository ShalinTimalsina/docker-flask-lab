# Four-service production architecture with isolated networks and an Nginx reverse proxy
services:
  # Nginx reverse proxy service - the only service exposing ports to the host
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-network

  # Frontend service serving static React single-page app
  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - frontend-network

  # Backend service running Python 3.12 Flask and Gunicorn
  backend:
    build: ./backend
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass123
    depends_on:
      - database
    networks:
      - frontend-network
      - database-network

  # Database service running PostgreSQL 17 (completely isolated from public host and frontend)
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database-network

# Network definitions for security isolation
networks:
  frontend-network:
  database-network:
    internal: true

# Named volume for persistent database storage
volumes:
  postgres-data:
